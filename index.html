<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Mentor - Personal AI Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<!-- Three.js for 3D Background Canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root {
  --bg-gradient: linear-gradient(135deg, #0d131f 0%, #152238 50%, #0a101d 100%);
  --glass-bg: rgba(22, 33, 54, 0.65);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
  --text-main: #f0f4f8;
  --text-muted: #8e9bb0;
  --accent-teal: #00f2fe;
  --accent-cyan: #4facfe;
  --accent-amber: #ffb703;
  --accent-rose: #ff4b5c;
  --accent-green: #00e676;
  --font-main: "Hind Siliguri", "Outfit", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow-x: hidden; }

body {
  background: var(--bg-gradient);
  color: var(--text-main);
  font-family: var(--font-main);
  font-size: 15px;
  line-height: 1.5;
  perspective: 1200px;
}

#bg3d {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: 0; pointer-events: none;
}

.app-container {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.8fr);
  gap: 24px;
  max-width: 1320px;
  margin: 0 auto;
  padding: 24px;
  min-height: 100vh;
}

.panel-3d {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  box-shadow: var(--glass-shadow);
  display: flex;
  flex-direction: column;
  transform-style: preserve-3d;
  transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
  overflow: hidden;
}

/* Header UI */
.chat-head {
  padding: 20px 24px;
  border-bottom: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255, 255, 255, 0.03);
}

.chat-head h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--accent-teal), var(--accent-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.chat-head p { margin: 0; color: var(--text-muted); font-size: 13px; }

/* Buttons */
.btn {
  border: none;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-teal));
  color: #051124;
  padding: 9px 16px;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
  transition: all 0.2s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5); }
.btn.ghost { background: rgba(255, 255, 255, 0.08); color: var(--text-main); box-shadow: none; border: 1px solid var(--glass-border); }
.btn.ghost:hover { background: rgba(255, 255, 255, 0.15); }
.btn.small { padding: 5px 12px; font-size: 13px; border-radius: 8px; }

/* Messages Chat Area */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-height: 65vh;
}

.msg {
  max-width: 80%;
  padding: 12px 18px;
  border-radius: 18px;
  line-height: 1.6;
  word-wrap: break-word;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.bot {
  align-self: flex-start;
  background: rgba(0, 242, 254, 0.1);
  border: 1px solid rgba(0, 242, 254, 0.2);
  color: #e2f8ff;
  border-bottom-left-radius: 4px;
}

.msg.me {
  align-self: flex-end;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-teal));
  color: #041221;
  font-weight: 600;
  border-bottom-right-radius: 4px;
}

.msg.note {
  align-self: center;
  background: rgba(255, 183, 3, 0.15);
  border: 1px solid rgba(255, 183, 3, 0.3);
  color: var(--accent-amber);
  font-size: 13px;
  border-radius: 20px;
}

.composer {
  display: flex;
  gap: 12px;
  padding: 18px 24px;
  border-top: 1px solid var(--glass-border);
  background: rgba(0, 0, 0, 0.2);
}

.composer input, .add input, .add select {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
  outline: none;
}
.composer input:focus, .add input:focus, .add select:focus {
  border-color: var(--accent-cyan);
}

/* Side Dashboard Blocks */
.side { overflow-y: auto; max-height: calc(100vh - 48px); padding: 10px; }
.block {
  padding: 20px;
  margin-bottom: 16px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  transition: transform 0.2s ease;
}
.block:hover { transform: translateZ(10px); }
.block h2 { margin: 0 0 14px; font-size: 17px; color: var(--accent-cyan); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat {
  background: rgba(255, 255, 255, 0.04);
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.05);
}
.stat b { display: block; font-size: 20px; color: var(--accent-teal); }
.stat span { font-size: 12px; color: var(--text-muted); }

/* Progress bar */
.bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin: 12px 0; }
.bar-fill { height: 100%; width: 0%; background: var(--accent-green); transition: width 0.4s ease; }
.bar-fill.at_risk { background: var(--accent-amber); }
.bar-fill.over { background: var(--accent-rose); }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid var(--glass-border); }
.t-item { position: relative; padding: 0 0 14px 16px; }
.t-item::before {
  content: ""; position: absolute; left: -22px; top: 4px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--accent-amber); box-shadow: 0 0 10px var(--accent-amber);
}
.t-item.done::before { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
.t-item.overdue::before { background: var(--accent-rose); box-shadow: 0 0 10px var(--accent-rose); }
.t-time { font-size: 12px; color: var(--text-muted); }
.t-title { font-weight: 600; color: #fff; }

.exp-list { list-style: none; margin: 12px 0 0; padding: 0; }
.exp-list li {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.05); font-size: 14px;
}

@media (max-width: 900px) {
  .app-container { grid-template-columns: 1fr; }
}
.t-actions{display:flex;gap:6px;margin-top:6px}
.exp-list li b{color:var(--accent-teal)}
</style>
</head>
<body>

<canvas id="bg3d"></canvas>

<div class="app-container">
  <!-- Chat Main Panel -->
  <section class="panel-3d chat" id="chatPanel">
    <div class="chat-head">
      <div>
        <h1>Apnar Mentor AI</h1>
        <p id="modelInfo">Connecting to LLM...</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn ghost small" id="notifyBtn">Notification</button>
        <button class="btn small" id="checkinBtn">Check-in</button>
      </div>
    </div>
    
    <div class="messages" id="messages"></div>
    
    <div class="composer">
      <input id="input" placeholder="Ajke ki ki korlen? Ba notun task / khoroch likhun..." autocomplete="off">
      <button class="btn" id="sendBtn">Pathan</button>
    </div>
  </section>

  <!-- Side Dashboard Panel -->
  <aside class="panel-3d side" id="sidePanel">
    <!-- Insights Block -->
    <div class="block">
      <h2>Kajer Pattern & Analytics</h2>
      <div class="stats">
        <div class="stat"><b id="sRate">-</b><span>complete</span></div>
        <div class="stat"><b id="sStreak">-</b><span>streak</span></div>
        <div class="stat"><b id="sBest">-</b><span>best slot</span></div>
      </div>
      <p id="sTip" style="font-size:13px; color:var(--text-muted); margin-top:10px;"></p>
    </div>

    <!-- Monthly Budget & Expenses Block -->
    <div class="block">
      <h2>Finance Tracker</h2>
      <div style="display:flex; gap:8px;">
        <input id="bAmount" type="number" placeholder="Mashik Budget (Tk)">
        <button class="btn small" id="bSave">Save</button>
      </div>
      <div class="bar"><div class="bar-fill" id="bFill"></div></div>
      <div class="stats">
        <div class="stat"><b id="fSpent">-</b><span>khoroch</span></div>
        <div class="stat"><b id="fLeft">-</b><span>baki</span></div>
        <div class="stat"><b id="fToday">-</b><span>ajker safe</span></div>
      </div>
      <p id="fTip" style="font-size:13px; color:var(--text-muted); margin-top:10px;"></p>
      
      <form class="add" id="expForm" style="display:grid; gap:8px; margin-top:12px;">
        <div style="display:flex; gap:8px;">
          <input id="eAmount" type="number" placeholder="Tk" required style="width:90px;">
          <input id="ePurpose" placeholder="Kon kaje khoroch?" required>
        </div>
        <select id="eCat">
          <option value="food">Khabar</option>
          <option value="transport">Jatayat</option>
          <option value="study">Poralekha</option>
          <option value="bills">Bill</option>
          <option value="shopping">Kenakata</option>
          <option value="health">Shasthyo</option>
          <option value="other">Onnano</option>
        </select>
        <button class="btn small" type="submit">Khoroch Add Korun</button>
      </form>
      <ul class="exp-list" id="expList"></ul>
    </div>

    <!-- Task Creation Block -->
    <div class="block">
      <h2>Notun Task</h2>
      <form class="add" id="addForm" style="display:grid; gap:8px;">
        <input id="tTitle" placeholder="Task er naam" required>
        <input id="tTime" type="datetime-local" required>
        <button class="btn small" type="submit">Task Add Korun</button>
      </form>
    </div>

    <!-- Timeline Block -->
    <div class="block">
      <h2>Diner Timeline</h2>
      <ul class="timeline" id="timeline"></ul>
      <p id="noTasks" style="color:var(--text-muted); font-size:13px; display:none;">Kono task nei.</p>
    </div>
  </aside>
</div>

<script>
// --- Three.js Interactive 3D Background Particles ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg3d'), alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);

const particleCount = 120;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
for(let i=0; i<particleCount*3; i++) {
  positions[i] = (Math.random() - 0.5) * 15;
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const material = new THREE.PointsMaterial({ color: 0x00f2fe, size: 0.05, transparent: true, opacity: 0.6 });
const particles = new THREE.Points(geometry, material);
scene.add(particles);
camera.position.z = 5;

let mouseX = 0, mouseY = 0;
document.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 0.5;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 0.5;
});

function animate() {
  requestAnimationFrame(animate);
  particles.rotation.x += 0.001;
  particles.rotation.y += 0.001;
  camera.position.x += (mouseX - camera.position.x) * 0.05;
  camera.position.y += (-mouseY - camera.position.y) * 0.05;
  camera.lookAt(scene.position);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- API & UI Integration Logic ---
const $ = (id) => document.getElementById(id);
const msgBox = $("messages");

async function api(path, opts) {
  const r = await fetch("/api" + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : ("Error " + r.status));
  return data;
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : role === "note" ? "note" : "bot");
  d.textContent = text;
  msgBox.appendChild(d);
  msgBox.scrollTop = msgBox.scrollHeight;
  return d;
}

function fmtTime(ts) {
  return new Date(ts * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

async function loadTasks() {
  const tasks = await api("/tasks");
  const ul = $("timeline"); ul.innerHTML = "";
  $("noTasks").style.display = tasks.length ? "none" : "block";
  tasks.forEach(t => {
    const overdue = t.status === "pending" && t.due_ts * 1000 < Date.now();
    const li = document.createElement("li");
    li.className = "t-item " + (overdue ? "overdue" : t.status);
    const time = document.createElement("div"); time.className = "t-time"; time.textContent = fmtTime(t.due_ts);
    const title = document.createElement("div"); title.className = "t-title"; title.textContent = t.title;
    li.append(time, title);
    if (t.status === "pending") {
      const row = document.createElement("div"); row.className = "t-actions";
      const done = document.createElement("button"); done.className = "btn small"; done.textContent = "Done";
      done.onclick = async () => { await post(`/tasks/${t.id}/done`); await refresh(); };
      const miss = document.createElement("button"); miss.className = "btn ghost small"; miss.textContent = "Hoyni";
      miss.onclick = async () => {
        const reason = prompt("Keno hoyni? (optional)") || "";
        await post(`/tasks/${t.id}/missed`, { reason }); await refresh();
      };
      row.append(done, miss); li.appendChild(row);
    } else if (t.status === "missed" && t.reason) {
      const r = document.createElement("div"); r.className = "t-time"; r.textContent = "Karon: " + t.reason; li.appendChild(r);
    }
    ul.appendChild(li);
  });
}

async function loadFinance() {
  const f = await api("/finance"); const s = f.summary;
  $("fSpent").textContent = s.spent + " Tk";
  $("fLeft").textContent = s.budget ? s.remaining + " Tk" : "-";
  $("fToday").textContent = s.budget ? s.safe_daily + " Tk" : "-";
  const fill = $("bFill");
  fill.style.width = s.budget ? Math.min(100, (s.spent / s.budget) * 100) + "%" : "0%";
  fill.className = "bar-fill " + (s.status === "over" || s.status === "at_risk" ? s.status : "");
  const tips = {
    no_budget: "Mashik budget set korun, tahole safe daily limit dekhabo.",
    on_track: `Thik pothe achen. Ei pace-e mash shesh hobe ~${s.projected} Tk.`,
    at_risk: `Savdhan! Ei pace-e mash shesh hobe ~${s.projected} Tk, budget-er beshi.`,
    over: `Budget ${Math.abs(s.remaining)} Tk ati-krom koreche.`,
  };
  $("fTip").textContent = tips[s.status] || "";
  const ul = $("expList"); ul.innerHTML = "";
  f.expenses.forEach(e => {
    const li = document.createElement("li");
    const a = document.createElement("span"); a.textContent = e.purpose;
    const b = document.createElement("b"); b.textContent = Math.round(e.amount) + " Tk";
    li.append(a, b); ul.appendChild(li);
  });
}

async function loadInsights() {
  const i = await api("/insights");
  $("sRate").textContent = i.rate == null ? "-" : Math.round(i.rate * 100) + "%";
  $("sStreak").textContent = i.streak_days;
  $("sBest").textContent = i.best_slot || "-";
  $("sTip").textContent = i.tip || "";
}

async function refresh() {
  await Promise.all([loadTasks(), loadFinance(), loadInsights()]).catch(err => addMsg("note", "Error: " + err.message));
}

let sending = false;
async function send() {
  const text = $("input").value.trim(); if (!text || sending) return;
  sending = true; $("input").value = ""; addMsg("user", text);
  const typing = addMsg("bot", "...");
  try {
    const d = await post("/chat", { message: text });
    typing.textContent = d.reply;
    await refresh();
  } catch (err) { typing.remove(); addMsg("note", "Error: " + err.message); }
  sending = false;
}
$("sendBtn").onclick = send;
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

$("expForm").onsubmit = async (e) => {
  e.preventDefault();
  try {
    await post("/expenses", { amount: parseFloat($("eAmount").value), purpose: $("ePurpose").value, category: $("eCat").value });
    $("eAmount").value = ""; $("ePurpose").value = ""; await loadFinance();
  } catch (err) { addMsg("note", "Error: " + err.message); }
};

$("bSave").onclick = async () => {
  const v = parseFloat($("bAmount").value);
  if (!(v > 0)) return;
  try { await post("/budget", { amount: v }); $("bAmount").value = ""; await loadFinance(); }
  catch (err) { addMsg("note", "Error: " + err.message); }
};

$("addForm").onsubmit = async (e) => {
  e.preventDefault();
  const due = new Date($("tTime").value).getTime() / 1000;
  try {
    const r = await post("/tasks", { title: $("tTitle").value, due_ts: Math.floor(due) });
    if (r.predicted_success != null) addMsg("note", `Task add holo. Complete korar sombhabona ~${r.predicted_success}%`);
    $("tTitle").value = ""; $("tTime").value = ""; await refresh();
  } catch (err) { addMsg("note", "Error: " + err.message); }
};

$("checkinBtn").onclick = async () => {
  const typing = addMsg("bot", "...");
  try { const d = await post("/checkin"); typing.textContent = d.reply; }
  catch (err) { typing.remove(); addMsg("note", "Error: " + err.message); }
};

$("notifyBtn").onclick = async () => {
  if ("Notification" in window) await Notification.requestPermission();
  addMsg("note", "Notification chalu hoyeche.");
};

async function pollDue() {
  try {
    const due = await api("/due");
    for (const t of due) {
      addMsg("note", "Somoy hoyeche: " + t.title);
      if ("Notification" in window && Notification.permission === "granted") new Notification("Task time", { body: t.title });
    }
    if (due.length) await loadTasks();
  } catch (e) { /* ignore */ }
}
setInterval(pollDue, 30000);

async function boot() {
  const h = await api("/health").catch(() => ({ ok: false }));
  $("modelInfo").textContent = h.ok ? `${h.provider} - ${h.model}` : "Server offline";
  const hist = await api("/history").catch(() => []);
  hist.forEach(m => addMsg(m.role, m.content));
  await refresh(); pollDue();
}
boot();
</script>
</body>
</html>
